name: Piko Sudoku — TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piko-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and test Piko
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync ios
          test "$(node -p "require('./capacitor.config.json').appId")" = 'pl.niekazmuliczyc.piko'
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Archive Piko
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID"
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Piko.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Prepare embedded SDKs for distribution signing
        run: |
          for SDK in GoogleMobileAds UserMessagingPlatform; do
            FRAMEWORK="build/Piko.xcarchive/Products/Applications/App.app/Frameworks/$SDK.framework"
            test -d "$FRAMEWORK"
            codesign --remove-signature "$FRAMEWORK"
          done
      - name: Sign and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8"
          umask 077
          mkdir -p "$RUNNER_TEMP/piko-private-keys"
          KEY_PATH="$RUNNER_TEMP/piko-private-keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          python3 - <<'PY'
          import os, plistlib
          with open('build/ExportOptions.plist','wb') as f:
              plistlib.dump(dict(method='app-store-connect', destination='upload', teamID=os.environ['APPLE_TEAM_ID'], signingStyle='automatic', uploadSymbols=True, manageAppVersionAndBuildNumber=False),f)
          PY
          xcodebuild -exportArchive -archivePath build/Piko.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove temporary authentication file
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          target=(root/'piko-private-keys').resolve()
          assert target.parent==root
          shutil.rmtree(target,ignore_errors=True)
          PY
